<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Flappy Bird</h1>
      <div class="hud">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best-score">0</strong></span>
      </div>
      <canvas id="game" width="420" height="600" aria-label="Flappy Bird game canvas"></canvas>
      <p class="instructions">Press <kbd>Space</kbd> or click/tap to flap. Press <kbd>R</kbd> to restart.</p>
      <p id="status" class="status" aria-live="polite">Press Space or tap to start</p>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
